<h1>경기도 대학생 팬을 위한 방학 서울 콘서트</h1>
<p>① 학업·근로 일정 때문에 공연 참여가 제한되고, 특히 시험기간과 겹치면 관람을 포기한다.</p>
<p>② 방학 시즌 서울에서 아티스트·팬들과 같은 공간에서 즐기는 콘서트를 열고, SNS 인지 → 일정 확인·예매 → 현장 체험·관람 → 후기 공유로 경험을 이어 티켓과 현장 한정 굿즈에서 수익을 낸다.</p>
<p>③ 근거는 가상 페르소나(23살 대학생)이며, VR/XR이 필요한 근거는 없어 대면 공연으로 정리했다. 티켓 가격과 대관비는 아직 «?» 이다.</p>
